[project]
name = "dishari"
version = "1.0.0"
description = "Website for Dishari, a nonprofit organisation in Bangladesh (Dream of New Earth)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<6.1",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
]

[project.optional-dependencies]
dev = [
    "django-browser-reload>=1.17",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle / pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "DJ",           # django
    "SIM",          # simplify
    "S",            # bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
