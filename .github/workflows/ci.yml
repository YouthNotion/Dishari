name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt uv
      - name: Lockfile and requirements are in sync
        run: |
          uv lock --check
          # Both requirement files are generated from uv.lock and must match a fresh export.
          # Header comments (lines starting with "#") hold the export command, so ignore them.
          check() {
            local file="$1"; shift
            uv export -q --format requirements-txt --no-hashes --no-emit-project "$@" -o "/tmp/$file"
            if ! diff -u <(grep -v '^#' "$file") <(grep -v '^#' "/tmp/$file"); then
              echo "::error file=$file::$file is out of date with uv.lock. Regenerate it with: uv export --format requirements-txt --no-hashes --no-emit-project $* -o $file"
              return 1
            fi
          }
          status=0
          check requirements.txt --no-dev || status=1
          check requirements-dev.txt --extra dev || status=1
          exit "$status"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest
      - name: Production checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-key-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: example.org
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py collectstatic --noinput
