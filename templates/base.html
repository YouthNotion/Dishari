{% load static site_tags %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }} · {{ site.tagline }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ site.mission|truncatewords:30 }}{% endblock %}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#078a35">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.name }} · {{ site.tagline }}">
  <meta property="og:description" content="{{ site.mission|truncatewords:30 }}">
  <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'img/logo.png' %}">
  <link rel="icon" href="{% static 'img/favicon-32.png' %}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <script src="{% static 'js/theme-init.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  <script src="{% static 'js/site.js' %}" defer></script>
  <noscript><link rel="stylesheet" href="{% static 'css/noscript.css' %}"></noscript>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {% include "partials/header.html" %}

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}
</body>
</html>
