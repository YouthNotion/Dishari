{% extends "base.html" %}
{% load site_tags %}

{% block title %}Page not found · {{ site.name }}{% endblock %}

{% block content %}
<section class="section error-page" aria-labelledby="error-title">
  <div class="container error-page__inner">
    <p class="error-page__code" aria-hidden="true">404</p>
    <h1 id="error-title" class="section__title">Sorry, we couldn’t find that page</h1>
    <p class="lead">The page may have moved, or the link may be mistyped.</p>
    <a class="btn btn--primary" href="{% url 'core:home' %}">Back to home {% icon "arrow-right" 18 %}</a>
  </div>
</section>
{% endblock %}
